name: CI/CD

# Every push and PR is tested. Pushes to main that pass also deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # "Run workflow" button, for redeploying without a push

# Least privilege: nothing here writes back to the repo. Matters more than
# usual because the deploy job runs on a runner inside production.
permissions:
  contents: read

# Never let two deploys touch the server at once. Queue them instead of
# cancelling: a half-finished `docker compose up` is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # matches the Dockerfile base image
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py check

      - name: Fail if a model change is missing its migration
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py test --verbosity 2

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default docker driver can't read/write the GitHub Actions cache;
      # buildx installs the container driver that can.
      - uses: docker/setup-buildx-action@v3

      # Builds exactly what the server will build, so a broken Dockerfile or a
      # collectstatic failure surfaces here instead of mid-deploy.
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: darood-collection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on a self-hosted runner installed on server-prod-01. The runner polls
  # GitHub outbound, so the server needs no inbound SSH from the internet --
  # port 22 stays closed to everything but the office.
  deploy:
    name: Deploy to production
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, darood-prod]
    environment: production  # lets you add a required reviewer in repo settings
    steps:
      # This runner sits on the production box and the repo is public, so the
      # `if:` above is load-bearing. Re-check at runtime: if that condition is
      # ever loosened by accident, this still refuses to run untrusted code.
      # Values come through env, never interpolated into the script, so a
      # hostile ref name can't inject shell.
      - name: Refuse to deploy anything but a push to main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to deploy ref '$REF'"
            exit 1
          fi
          case "$EVENT" in
            push|workflow_dispatch) ;;
            *) echo "::error::Refusing to deploy on event '$EVENT'"; exit 1 ;;
          esac
          echo "Gate passed: $EVENT on $REF"

      - name: Pull and restart
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          cd "${DEPLOY_PATH:-/srv/hosting/apps/Darood-Collection}"

          # Refuse to deploy over uncommitted edits to tracked files. This used
          # to warn and continue, and `reset --hard` silently destroyed a
          # server-local docker-compose.yml that held the nginx network config
          # -- taking the site down. Config that production needs belongs in
          # git; anything else is a deliberate decision for a human to make.
          if ! git diff --quiet HEAD; then
            echo "::error::Tracked files have uncommitted changes on the server."
            git status --short
            echo "Commit them to the repo, or discard them deliberately on the"
            echo "server with 'git checkout -- <path>', then re-run this deploy."
            exit 1
          fi

          echo "==> Fetching origin/main"
          git fetch --prune origin main
          git reset --hard origin/main
          echo "==> Now at $(git log -1 --oneline)"

          # Runs the freshly-pulled script, not the one that was on disk when
          # this job started.
          bash scripts/deploy.sh
